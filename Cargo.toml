[package]
name = "unbox"
version = "0.1.0"
edition = "2021"
description = "DSSAD data conversion tool converts txt to json and ts to mp4"

[dependencies]
eframe = "0.31"
egui-file-dialog = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
log = "0.4"
env_logger = "0.11"
muxide = "0.2"
mpeg2ts = "0.6"
